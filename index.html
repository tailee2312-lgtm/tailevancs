,favorite:!!x.favorite,mastery:['new','learning','known'].includes(x.mastery)?x.mastery:'new',updatedAt:Number(x.updatedAt)||0}}).filter(x=>x.kanji&&x.vi);clean.practiceSets=Array.isArray(raw.practiceSets)?raw.practiceSets.slice(0,500).map(v=>{let x=obj(v);return{id:str(x.id,100)||id(),title:str(x.title,250),description:str(x.description,2000),updatedAt:Number(x.updatedAt)||0,sentences:Array.isArray(x.sentences)?x.sentences.slice(0,1000).map(k=>({id:str(k.id,100)||id(),jp:str(k.jp,4000),romaji:str(k.romaji,4000),vi:str(k.vi,4000),updatedAt:Number(k.updatedAt)||0})).filter(z=>z.jp):[]}}).filter(x=>x.title):[];return clean}
let state=fresh();try{const embedded=JSON.parse($('#embedded-data').textContent);if(embedded.meta?.workspaceId==='jcsw-default'&&!embedded.templates?.length){state=fresh();state.meta.workspaceId='jcsw-starter-v1';state.meta.updatedAt=0}else state=sanitize(embedded)}catch(e){console.warn('Embedded data error:',e)}
const dbKey='jcsw-state-'+state.meta.workspaceId;
let saveError=false,db=null,view='dashboard',tplFilter={cat:'all',channel:'all',q:'',sort:'recent'},wordFilter={q:'',mastery:'all'},navOpen=false,searchQuery='',selectedSet=null;
function openDb(){return new Promise(resolve=>{if(!window.indexedDB)return resolve(null);try{let r=indexedDB.open('JapaneseCSWorkspace',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('states'))r.result.createObjectStore('states')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
function dbRead(key){return new Promise(resolve=>{if(!db)return resolve(null);try{let tx=db.transaction('states','readonly'),q=tx.objectStore('states').get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
function dbWrite(key,val){return new Promise(resolve=>{if(!db)return resolve(false);try{let tx=db.transaction('states','readwrite');tx.objectStore('states').put(val,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false)}catch(e){resolve(false)}})}
let saveTimer;function change(){state.meta.updatedAt=now();clearTimeout(saveTimer);saveTimer=setTimeout(persist,240)}
async function persist(){try{const serialized=JSON.stringify(state);const okay=await dbWrite(dbKey,serialized);if(!okay)localStorage.setItem(dbKey,serialized);saveError=false}catch(e){saveError=true;toast('Không thể tự lưu. Hãy xuất HTML hoặc JSON để sao lưu.','error')}}
async function init(){db=await openDb();let stored=await dbRead(dbKey);if(!stored){try{stored=localStorage.getItem(dbKey)}catch(e){}}if(stored){try{let candidate=sanitize(JSON.parse(stored));if(candidate.meta.updatedAt>state.meta.exportedAt&&candidate.meta.updatedAt>=state.meta.updatedAt)state=candidate}catch(e){console.warn('Saved data error',e)}}applySettings();render();await persist()}
const accents={blue:'#8eaafa',mint:'#72d5b8',violet:'#b4a0ff',pink:'#e99cc3'};
function applySettings(){const theme=state.settings.theme;document.documentElement.dataset.theme=theme;const a=state.settings.accent;if(theme==='dark'||theme==='light'||a!=='blue'){document.documentElement.style.setProperty('--accent',accents[a]||accents.blue);const rgb=(accents[a]||accents.blue).match(/[0-9a-f]{2}/gi).map(x=>parseInt(x,16));document.documentElement.style.setProperty('--accent-rgb',rgb.join(','))}else{document.documentElement.style.removeProperty('--accent');document.documentElement.style.removeProperty('--accent-rgb')}document.documentElement.style.setProperty('--fontscale',state.settings.fontScale)}
function toast(msg,type='ok'){const root=$('#toast-root'),el=document.createElement('div');el.className='toast'+(type==='error'?' error':'');el.innerHTML=ico(type==='error'?'alert':'check')+'<span>'+esc(msg)+'</span>';root.append(el);setTimeout(()=>el.remove(),3800)}
function catName(c){let t=CATS.find(x=>x[0]===c);return t?t[1]:c||'Khác'}
function avatar(cls=''){return state.settings.avatar?`<img class="avatar ${cls}" src="${state.settings.avatar}" alt="Avatar">`:`<div class="avatar ${cls}">${esc((state.meta.name||'N')[0].toUpperCase())}</div>`}
const menuLinks=[['dashboard','Dashboard','dashboard'],['templates','Templates','templates'],['dictionary','Dictionary','dictionary'],['typing','Typing Trainer','keyboard'],['favorites','Favorites','star'],['library','My Library','folder'],['settings','Settings','settings']];
function navHTML(){return`<aside class="sidebar" aria-label="Menu chính"><div class="brand"><div class="brand-emblem">N</div><div><strong>NIHONGO CS</strong><small>PERSONAL WORKSPACE</small></div></div><div class="nav-eyebrow">WORKSPACE</div>${menuLinks.slice(0,4).map(([key,label,icon])=>navItem(key,label,icon)).join('')}<div class="nav-eyebrow">MY COLLECTION</div>${menuLinks.slice(4,6).map(([key,label,icon])=>navItem(key,label,icon)).join('')}<div class="nav-eyebrow">PREFERENCES</div>${navItem('settings','Settings','settings')}<div class="sidebar-bottom"><div class="status-box"><div class="status-row"> <span class="status-dot"></span><b>Offline Ready</b> <span style="margin-left:auto">v${VERSION}</span></div><div class="status-row" style="margin-top:9px">${ico('save')} <span>${saveError?'Cần sao lưu thủ công':'Tự lưu dữ liệu cục bộ'}</span></div></div><div class="profile-tile" data-nav="settings">${avatar()}<div><strong>${esc(state.meta.name)}</strong><small>${esc(state.meta.workspaceName)}</small></div>${ico('chevron')}</div></div></aside>`}
function navItem(key,label,icon){return`<button class="nav-link ${view===key?'active':''}" data-nav="${key}">${ico(icon)}<span>${label}</span>${key==='favorites'?`<span class="count">${state.templates.filter(t=>t.favorite).length+state.vocabulary.filter(w=>w.favorite).length}</span>`:''}</button>`}
function render(){document.title=`${state.meta.workspaceName} · v${VERSION}`;let loc=menuLinks.find(x=>x[0]===view)?.[1]||'Dashboard';$('#app').innerHTML=`<div class="screen-backdrop" data-action="close-nav"></div><div class="layout">${navHTML()}<div class="main-wrap"><header class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="icon-btn mobile-menu" data-action="toggle-nav" aria-label="Mở menu">${ico('menu')}</button><div class="topbar-location">Workspace ${ico('chevron')} <strong>${loc}</strong></div></div><div class="top-actions"><button class="search-trigger" data-action="search" aria-label="Tìm kiếm">${ico('search')}<span>Tìm kiếm nhanh...</span><kbd>Ctrl K</kbd></button><button class="icon-btn desktop-only" data-nav="library" title="Sao lưu dữ liệu">${ico('save')}</button><button class="icon-btn desktop-only" data-nav="settings" title="Cài đặt">${ico('settings')}</button>${avatar('desktop-only')}</div></header><main class="content" id="page-content">${pageContent()}</main></div></div><nav class="mobile-bottom" aria-label="Điều hướng nhanh">${[['dashboard','Home','dashboard'],['templates','Templates','templates'],['dictionary','Dictionary','dictionary'],['favorites','Saved','star']].map(([a,b,c])=>`<button data-nav="${a}" class="${view===a?'active':''}">${ico(c)}<span>${b}</span></button>`).join('')}</nav>`;document.body.classList.toggle('sidebar-open',navOpen)}
function go(v){if(!menuLinks.some(x=>x[0]===v))return;view=v;navOpen=false;render();window.scrollTo({top:0,behavior:'instant'})}
function heading(eyebrow,title,desc,btn=''){return`<div class="section-top"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subline">${desc}</p></div>${btn}</div>`}
function pageContent(){switch(view){case'dashboard':return dashboard();case'templates':return templatesPage();case'dictionary':return dictionaryPage();case'favorites':return favoritesPage();case'library':return libraryPage();case'typing':return typingPage();case'settings':return settingsPage();default:return dashboard()}}
function dashboard(){const recent=[...state.templates].sort((a,b)=>(b.usageCount-a.usageCount)||b.updatedAt-a.updatedAt).slice(0,4);const categories=CATS.slice(0,6);return`${heading('こんにちは · Welcome back',`Xin chào, ${esc(state.meta.name)}!`,'Không gian làm việc Customer Service tiếng Nhật của bạn.')}<section class="hero"><div><div class="eyebrow">YOUR DAILY JAPANESE CS COMPANION</div><h1>Từng câu trả lời chuyên nghiệp,<br>mọi tình huống đều chủ động.</h1><p>Truy cập template nhanh, tra từ chuyên ngành và tự xây dựng thư viện hỗ trợ khách hàng theo cách của bạn.</p><div class="hero-actions"><button class="btn" data-nav="templates">${ico('templates')} Mở Templates ${ico('arrow')}</button><button class="btn btn-secondary" data-action="new-template">${ico('plus')} Thêm mẫu câu</button></div></div><div class="hero-badge">日本語</div></section><div class="grid cols4">${[['Mẫu câu CS',state.templates.length,'templates'],['Từ vựng',state.vocabulary.length,'dictionary'],['Đã ghim',state.templates.filter(t=>t.favorite).length+state.vocabulary.filter(w=>w.favorite).length,'star'],['Bộ câu tự tạo',state.practiceSets.length,'keyboard']].map(([a,b,c])=>`<div class="panel stat"><div><div class="stat-label">${a}</div><div class="stat-number">${b}</div></div><div class="stat-icon">${ico(c)}</div></div>`).join('')}</div><div class="dashboard-lower"><section class="panel pad"><div class="panel-heading"><h2>Khám phá theo tình huống</h2><button class="tiny-link" data-nav="templates">Xem tất cả ${ico('arrow')}</button></div><div class="quick-cat-grid">${categories.map(c=>`<button class="cat-tile" data-cat="${c[0]}"><span class="cat-symbol">${ico(c[3])}</span><strong>${esc(c[1])}</strong><small>${esc(c[2])} · ${state.templates.filter(t=>t.category===c[0]).length}</small></button>`).join('')}</div></section><section class="panel pad"><div class="panel-heading"><h2>Mẫu câu thường dùng</h2><button class="tiny-link" data-nav="favorites">Đã lưu ${ico('arrow')}</button></div>${recent.length?recent.map(t=>`<div class="recent-item"><div style="min-width:0"><div class="recent-title">${esc(t.title)}</div><div class="recent-jp">${esc(t.jp.replace(/\n/g,' '))}</div></div><button class="icon-btn" title="Copy" data-action="copy-template" data-id="${esc(t.id)}">${ico('copy')}</button></div>`).join(''):`<p class="subline">Chưa có mẫu câu nào.</p>`}</section></div><div class="panel pad practice-banner"><div><span class="eyebrow">NEXT · PHASE 2</span><h2>Japanese Typing Trainer</h2><p class="subline" style="margin-top:6px">Chuẩn bị bộ câu riêng ngay từ Phase 1; chế độ gõ Romaji và IME sẽ kích hoạt trong Phase 2.</p></div><button class="btn btn-secondary" data-nav="typing">Quản lý bộ luyện ${ico('arrow')}</button></div><div class="subfooter">Japanese CS Workspace · Built for focused Japanese customer support · v${VERSION}</div>`}
function templatesPage(){const cats=[...CATS.map(x=>[x[0],x[1]]),...Array.from(new Set(state.templates.map(t=>t.category))).filter(x=>!CATS.some(c=>c[0]===x)).map(x=>[x,x])];let ts=state.templates.filter(t=>(tplFilter.cat==='all'||t.category===tplFilter.cat)&&(tplFilter.channel==='all'||t.channel===tplFilter.channel||t.channel==='both')&&match(tplFilter.q,[t.title,t.jp,t.vi,t.category,catName(t.category),...t.tags]));if(tplFilter.sort==='az')ts.sort((a,b)=>a.title.localeCompare(b.title,'vi'));else if(tplFilter.sort==='popular')ts.sort((a,b)=>b.usageCount-a.usageCount);else ts.sort((a,b)=>b.updatedAt-a.updatedAt);return`${heading('Knowledge Base / 01','Template Library','Tìm, sao chép và tùy chỉnh các mẫu câu cho Chat và Email CS.',`<button class="btn" data-action="new-template">${ico('plus')} Thêm template</button>`)}<div class="panel filters-panel"><div class="filter-row">${[['all','Tất cả'],...cats].map(x=>`<button class="pill ${tplFilter.cat===x[0]?'active':''}" data-filter-cat="${esc(x[0])}">${esc(x[1])}</button>`).join('')}</div><div class="filter-row"><div style="flex:1;min-width:180px" class="field" ><input data-input="tpl-query" value="${esc(tplFilter.q)}" placeholder="Tìm bằng tiếng Nhật, tiếng Việt, tag..." aria-label="Tìm mẫu câu"></div>${[['all','Tất cả kênh'],['chat','Chat'],['email','Email']].map(x=>`<button class="pill ${tplFilter.channel===x[0]?'active':''}" data-filter-channel="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="toolbar"><span class="toolbar-left">${ts.length} / ${state.templates.length} templates</span><select class="select-small" data-sort="template" aria-label="Sắp xếp"><option value="recent" ${tplFilter.sort==='recent'?'selected':''}>Mới cập nhật</option><option value="popular" ${tplFilter.sort==='popular'?'selected':''}>Dùng nhiều nhất</option><option value="az" ${tplFilter.sort==='az'?'selected':''}>Tên A-Z</option></select></div>${ts.length?`<div class="template-grid">${ts.map(templateCard).join('')}</div>`:empty('Không tìm thấy template','Thử từ khóa khác hoặc tạo mẫu câu mới.','new-template','Tạo template')}`}
function templateCard(t){return`<article class="panel t-card"><div class="t-meta"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag accent">${esc(catName(t.category))}</span><span class="tag">${esc(CHANNELS[t.channel])}</span></div><button class="icon-btn" data-action="fav-template" data-id="${esc(t.id)}" title="${t.favorite?'Bỏ ghim':'Ghim mẫu'}" style="color:${t.favorite?'var(--warning)':''}">${ico('star')}</button></div><div><h3>${esc(t.title)}</h3><div class="jp-text" style="margin-top:9px;white-space:pre-line">${esc(truncate(t.jp,190))}</div><div class="translation" style="margin-top:7px">${esc(truncate(t.vi,165))}</div></div><div class="t-foot"><span class="micro text-muted">${esc(TONES[t.tone]?.split(' · ')[0]||'丁寧')} · ${t.usageCount} lần copy</span><div class="action-group"><button class="icon-btn" data-action="detail-template" data-id="${esc(t.id)}" title="Xem chi tiết">${ico('eye')}</button><button class="icon-btn" data-action="edit-template" data-id="${esc(t.id)}" title="Chỉnh sửa">${ico('edit')}</button><button class="btn btn-sm" data-action="copy-template" data-id="${esc(t.id)}">${ico('copy')} Copy</button></div></div></article>`}
function dictionaryPage(){let words=state.vocabulary.filter(w=>(wordFilter.mastery==='all'||w.mastery===wordFilter.mastery)&&match(wordFilter.q,[w.kanji,w.kana,w.romaji,w.vi,w.exampleJP,w.exampleVI,w.category,w.type]));return`${heading('Knowledge Base / 02','CS Dictionary','Từ vựng chuyên ngành, kính ngữ và tình huống sử dụng thực tế.',`<button class="btn" data-action="new-word">${ico('plus')} Thêm từ mới</button>`)}<div class="panel filters-panel"><div class="filter-row"><div class="field" style="flex:1;min-width:160px;margin:0"><input value="${esc(wordFilter.q)}" data-input="word-query" placeholder="Tra bằng Kanji, Kana, Romaji hoặc tiếng Việt..." aria-label="Tra từ vựng"></div>${[['all','Tất cả'],['new','Chưa học'],['learning','Đang học'],['known','Đã thuộc']].map(x=>`<button class="pill ${wordFilter.mastery===x[0]?'active':''}" data-filter-mastery="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="toolbar"><span class="toolbar-left">${words.length} / ${state.vocabulary.length} mục từ</span></div>${words.length?`<div class="word-grid">${words.map(wordCard).join('')}</div>`:empty('Chưa có từ vựng phù hợp','Thêm từ mới hoặc điều chỉnh bộ lọc.','new-word','Thêm từ')}`}
function wordCard(w){return`<article class="panel word-card"><div class="word-top"><div><div class="word-kanji">${esc(w.kanji)}</div><div class="kana">${esc(w.kana)} <span style="color:var(--muted2)">· ${esc(w.romaji)}</span></div></div><button class="icon-btn" title="Ghim từ" data-action="fav-word" data-id="${esc(w.id)}" style="color:${w.favorite?'var(--warning)':''}">${ico('star')}</button></div><div class="word-meaning">${esc(w.vi)}</div><div class="tagrow" style="margin:0"><span class="tag">${esc(w.type||'Từ vựng')}</span><span class="tag">${esc(w.category||'CS')}</span></div><div class="word-example"><div class="jp-text">${esc(w.exampleJP)}</div><div class="translation">${esc(w.exampleVI)}</div></div><div class="word-foot"><select data-mastery="${esc(w.id)}" aria-label="Trạng thái học"><option value="new" ${w.mastery==='new'?'selected':''}>Chưa học</option><option value="learning" ${w.mastery==='learning'?'selected':''}>Đang học</option><option value="known" ${w.mastery==='known'?'selected':''}>Đã thuộc</option></select><div class="action-group"><button class="icon-btn" data-action="edit-word" data-id="${esc(w.id)}" title="Sửa từ">${ico('edit')}</button><button class="icon-btn" data-action="detail-word" data-id="${esc(w.id)}" title="Chi tiết">${ico('eye')}</button><button class="icon-btn" data-action="copy-word" data-id="${esc(w.id)}" title="Copy ví dụ">${ico('copy')}</button></div></div></article>`}
function favoritesPage(){const ts=state.templates.filter(x=>x.favorite),ws=state.vocabulary.filter(x=>x.favorite);return`${heading('My Collection','Favorites','Những câu và từ vựng quan trọng luôn ở một nơi.')}${ts.length?`<div class="panel-heading"><h2>Templates đã lưu · ${ts.length}</h2></div><div class="template-grid" style="margin-bottom:29px">${ts.map(templateCard).join('')}</div>`:''}${ws.length?`<div class="panel-heading"><h2>Từ vựng đã lưu · ${ws.length}</h2></div><div class="word-grid">${ws.map(wordCard).join('')}</div>`:''}${!ts.length&&!ws.length?empty('Chưa có mục đã ghim','Bấm biểu tượng ngôi sao trong Templates hoặc Dictionary để lưu tại đây.',null,null):''}`}
function libraryPage(){return`${heading('My Collection','My Library','Quản lý thư viện cá nhân và sao lưu dữ liệu an toàn.') }<div class="library-grid"><div class="panel library-tile">${ico('templates')}<h3>${state.templates.length} templates</h3><p>Mẫu câu theo các tình huống hỗ trợ khách hàng.</p><button class="btn btn-sm btn-secondary" data-nav="templates">Mở thư viện ${ico('arrow')}</button></div><div class="panel library-tile">${ico('dictionary')}<h3>${state.vocabulary.length} từ vựng</h3><p>Từ điển tiếng Nhật CS cùng ví dụ song ngữ.</p><button class="btn btn-sm btn-secondary" data-nav="dictionary">Mở từ điển ${ico('arrow')}</button></div><div class="panel library-tile">${ico('keyboard')}<h3>${state.practiceSets.length} bộ luyện</h3><p>Các bộ câu tự tạo, sẵn sàng cho Typing Phase 2.</p><button class="btn btn-sm btn-secondary" data-nav="typing">Xem bộ câu ${ico('arrow')}</button></div></div><section class="panel pad" style="margin-top:20px"><div class="panel-heading"><div><h2>Backup & Export</h2><p class="subline" style="margin-top:5px">Mang dữ liệu của bạn theo bằng một file độc lập.</p></div>${ico('shield')}</div><div class="grid cols3"><div><h3>Xuất HTML offline</h3><p class="subline" style="margin:9px 0 15px;min-height:57px">Tạo một bản HTML mới với toàn bộ dữ liệu, giao diện và avatar đã lưu.</p><button class="btn btn-block" data-action="export-html">${ico('download')} Xuất HTML</button></div><div><h3>Sao lưu JSON</h3><p class="subline" style="margin:9px 0 15px;min-height:57px">Nhỏ gọn, tiện nhập lại vào bản HTML mới khi nâng cấp.</p><button class="btn btn-block btn-secondary" data-action="export-json">${ico('download')} Xuất JSON</button></div><div><h3>Nhập dữ liệu</h3><p class="subline" style="margin:9px 0 15px;min-height:57px">Nhập bản sao lưu JSON, chọn gộp hoặc thay thế dữ liệu.</p><button class="btn btn-block btn-ghost" data-action="import-json">${ico('upload')} Nhập JSON</button></div></div><div class="notice" style="margin-top:20px"><strong>Lưu ý:</strong> Trình duyệt không tự ghi đè file HTML gốc. Sau khi chỉnh sửa, hãy dùng <b>Xuất HTML</b> để tải bản cập nhật. Tính năng tự lưu trên thiết bị phụ thuộc quyền lưu trữ của trình duyệt. Nên sao lưu JSON định kỳ.</div></section><section class="panel pad" style="margin-top:18px"><h2 style="margin-bottom:12px">Cách sử dụng dữ liệu</h2><div class="guide-steps"><div class="step"><strong>01 · Chỉnh sửa</strong>Tạo mẫu câu, từ vựng và bộ luyện của bạn.</div><div class="step"><strong>02 · Xuất HTML</strong>Tải file hoàn chỉnh, lưu vào USB / Drive cá nhân.</div><div class="step"><strong>03 · Mở lại</strong>Mở file trên máy khác mà không cần Internet.</div></div><div class="notice warning" style="margin-top:17px">${ico('alert')} Không nên lưu dữ liệu khách hàng thật, thông tin nội bộ nhạy cảm, mật khẩu hoặc nội dung cần bảo mật trong bản HTML chia sẻ cho người khác.</div></section>`}
function typingPage(){let set=state.practiceSets.find(x=>x.id===selectedSet);return`${heading('Next / Phase 2','Japanese Typing Trainer','Phase 1: tạo bộ câu cá nhân. Phần chấm tốc độ Romaji/IME sẽ được triển khai ở Phase 2.',`<button class="btn" data-action="new-set">${ico('plus')} Tạo bộ luyện</button>`)}<div class="notice" style="margin-bottom:20px"><strong>Đã chốt:</strong> Cả <b>Romaji Mode</b> và <b>Japanese IME Mode</b>. Trong Phase 1, bạn có thể tạo, thêm câu, sửa và xuất bộ luyện vào HTML; chức năng bắt đầu gõ, WPM và chấm lỗi hiện chưa kích hoạt.</div>${set?`<div style="margin-bottom:16px"><button class="btn btn-ghost btn-sm" data-action="set-back">← Tất cả bộ luyện</button></div><div class="panel pad"><div class="panel-heading"><div><h2>${esc(set.title)}</h2><p class="subline">${esc(set.description||'Bộ câu cá nhân')} · ${set.sentences.length} câu</p></div><button class="btn btn-sm" data-action="new-sentence" data-id="${esc(set.id)}">${ico('plus')} Thêm câu</button></div>${set.sentences.length?set.sentences.map((s,i)=>`<div class="sentence-row"><div><span class="micro text-muted">${i+1}. </span><span class="jp-text">${esc(s.jp)}</span>${s.romaji?`<p class="micro text-muted">${esc(s.romaji)}</p>`:''}${s.vi?`<small>${esc(s.vi)}</small>`:''}</div><div class="action-group"><button class="icon-btn" data-action="edit-sentence" data-id="${esc(s.id)}" data-set="${esc(set.id)}" title="Sửa">${ico('edit')}</button><button class="icon-btn" data-action="delete-sentence" data-id="${esc(s.id)}" data-set="${esc(set.id)}" title="Xóa">${ico('trash')}</button></div></div>`).join(''):empty('Bộ luyện chưa có câu','Thêm câu tiếng Nhật đầu tiên để chuẩn bị luyện gõ.','new-sentence','Thêm câu',set.id)}</div>`:`<div class="grid cols3">${state.practiceSets.map(p=>`<div class="panel pad"><div class="panel-heading"><h2>${esc(p.title)}</h2>${ico('keyboard')}</div><p class="subline" style="min-height:47px">${esc(truncate(p.description||'Bộ câu tự tạo',120))}</p><div class="tagrow"><span class="tag">${p.sentences.length} câu</span><span class="tag accent">Custom</span></div><div style="display:flex;justify-content:space-between;gap:6px;margin-top:14px"><button class="btn btn-sm" data-action="open-set" data-id="${esc(p.id)}">Mở bộ câu ${ico('arrow')}</button><button class="icon-btn" data-action="edit-set" data-id="${esc(p.id)}" title="Sửa">${ico('edit')}</button><button class="icon-btn" data-action="delete-set" data-id="${esc(p.id)}" title="Xóa">${ico('trash')}</button></div></div>`).join('')}${state.practiceSets.length?'':`<div class="panel pad" style="grid-column:1/-1">${empty('Chưa tạo bộ luyện nào','Ví dụ: Opening, Keigo, xử lý khiếu nại, đoạn Chat CS...','new-set','Tạo bộ luyện')}</div>`}</div>`}<section class="panel pad" style="margin-top:20px"><h2 style="margin-bottom:15px">Chế độ đã lên kế hoạch</h2><div class="grid cols2"><div class="notice"><strong>Romaji Mode</strong><br>Chấp nhận các cách gõ hợp lệ như shi/si, chi/ti, và quy tắc chữ nhỏ, âm ngắt.</div><div class="notice"><strong>Japanese IME Mode</strong><br>Chấm kết quả tiếng Nhật đã chuyển đổi bằng bộ gõ của máy, phân biệt lỗi nhập và lỗi chuyển đổi.</div></div></section>`}
function settingsPage(){return`${heading('Preferences','Personalization','Tùy chỉnh trải nghiệm làm việc phù hợp với bạn.') }<div class="setting-grid"><form class="panel setting-section" data-form="settings"><h2>Hồ sơ & không gian làm việc</h2><div class="settings-avatar">${avatar()}<div><button class="btn btn-sm btn-secondary" type="button" data-action="avatar-pick">${ico('upload')} Đổi avatar</button><p class="subline" style="font-size:10px;margin-top:7px">PNG/JPG/WebP · tự tối ưu ảnh khi lưu</p></div>${state.settings.avatar?`<button class="btn btn-sm btn-ghost" type="button" data-action="avatar-remove">Xóa</button>`:''}</div><div class="field"><label for="name">Tên hiển thị</label><input name="name" id="name" value="${esc(state.meta.name)}" maxlength="100" required></div><div class="field"><label for="workspaceName">Tên Workspace</label><input name="workspaceName" id="workspaceName" value="${esc(state.meta.workspaceName)}" maxlength="100" required></div><button class="btn" type="submit">${ico('check')} Lưu thay đổi</button></form><div class="panel setting-section"><h2>Appearance</h2><div class="field"><label>Giao diện</label><div class="theme-options">${[['dark','Dark'],['light','Light'],['sakura','Sakura']].map(x=>`<button class="theme-choice ${state.settings.theme===x[0]?'active':''}" data-theme="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="field" style="margin-top:21px"><label>Màu nhấn</label><div class="accent-options">${Object.entries(accents).map(([n,color])=>`<button class="swatch ${state.settings.accent===n?'active':''}" style="background:${color}" data-accent="${n}" title="${n}" aria-label="Màu ${n}"></button>`).join('')}</div></div><div class="field" style="margin-top:22px"><label for="font-scale">Cỡ chữ · ${Math.round(state.settings.fontScale*100)}%</label><input id="font-scale" type="range" min="0.85" max="1.25" step="0.05" value="${state.settings.fontScale}" data-input="font-scale"></div><p class="subline">Tự lưu lựa chọn ngay khi thay đổi. Cài đặt được nhúng trong bản HTML xuất.</p></div></div><div class="panel pad" style="margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><h2>Quản lý dữ liệu</h2><p class="subline" style="margin-top:6px">Xuất file HTML để sao lưu mọi nội dung và thông số cá nhân.</p></div><button class="btn" data-nav="library">${ico('folder')} Mở Backup & Export</button></div>`}
function empty(title,desc,action,label,arg){return`<div class="empty-state">${ico('archive')}<h3>${esc(title)}</h3><p class="subline" style="margin-bottom:18px">${esc(desc)}</p>${action?`<button class="btn btn-secondary" data-action="${action}" ${arg?`data-id="${esc(arg)}"`:''}>${ico('plus')} ${esc(label)}</button>`:''}</div>`}
function match(q,parts){let needle=norm(q);return!needle||parts.some(p=>norm(p).includes(needle))}function norm(s){return String(s||'').normalize('NFKC').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function truncate(v,n){v=String(v||'');return v.length>n?v.slice(0,n)+'…':v}
function modal(title,body,foot='',opts={}){$('#modal-root').innerHTML=`<div class="overlay ${opts.search?'search-overlay':''}" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2>${opts.subtitle?`<p class="subline" style="margin-top:5px">${esc(opts.subtitle)}</p>`:''}</div><button class="icon-btn" data-action="modal-close" aria-label="Đóng">${ico('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;let auto=$('[autofocus]',$('#modal-root'));if(auto)auto.focus();document.body.style.overflow='hidden'}
function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow=''}
function inputField(name,label,value='',opts={}){let idName='f-'+name;return`<div class="field"><label for="${idName}">${esc(label)}</label>${opts.textarea?`<textarea id="${idName}" name="${name}" rows="${opts.rows||3}" ${opts.required?'required':''} maxlength="${opts.max||10000}">${esc(value)}</textarea>`:`<input id="${idName}" name="${name}" type="text" value="${esc(value)}" ${opts.required?'required':''} maxlength="${opts.max||1000}">`}</div>`}
function selectField(name,label,value,arr){return`<div class="field"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" name="${name}">${arr.map(x=>`<option value="${esc(x[0])}" ${value===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`}
function tplEditor(item){const t=item||{title:'',category:'opening',channel:'both',tone:'standard',jp:'',vi:'',tags:[],notes:''};const cats=[...CATS.map(x=>[x[0],x[1]]),...Array.from(new Set(state.templates.map(t=>t.category))).filter(x=>!CATS.some(c=>c[0]===x)).map(x=>[x,x])];modal(item?'Chỉnh sửa template':'Tạo template mới',`<form id="edit-form" data-form="template" data-id="${esc(item?.id||'')}">${inputField('title','Tên mẫu câu',t.title,{required:true,max:300})}<div class="row-fields">${selectField('category','Danh mục',t.category,[...cats,['__custom','+ Danh mục mới']])}${selectField('channel','Kênh',t.channel,Object.entries(CHANNELS))}</div><div class="field ${t.category==='__custom'?'':'hidden'}" id="custom-cat-holder"><label>Danh mục mới</label><input name="customCategory" placeholder="VD: 予約対応"></div>${selectField('tone','Mức độ lịch sự',t.tone,Object.entries(TONES))}${inputField('jp','Nội dung tiếng Nhật',t.jp,{textarea:true,required:true,rows:4})}${inputField('vi','Nghĩa / hướng dẫn tiếng Việt',t.vi,{textarea:true,rows:3})}${inputField('tags','Tags (ngăn cách bằng dấu phẩy)',t.tags.join(', '))}${inputField('notes','Ghi chú cá nhân (tùy chọn)',t.notes,{textarea:true,rows:2})}<p class="modal-note">Có thể chèn biến như {customer_name}, {order_id}, {date}. Hệ thống sẽ yêu cầu nhập trước khi sao chép.</p></form>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button>${item?`<button class="btn btn-danger" data-action="delete-template" data-id="${esc(item.id)}">${ico('trash')} Xóa</button>`:''}<button class="btn" type="submit" form="edit-form">${ico('save')} Lưu template</button>`)}
function wordEditor(item){const w=item||{kanji:'',kana:'',romaji:'',vi:'',type:'名詞',category:'CS',exampleJP:'',exampleVI:'',notes:''};modal(item?'Sửa từ vựng':'Thêm từ vựng',`<form id="edit-form" data-form="word" data-id="${esc(item?.id||'')}"><div class="row-fields">${inputField('kanji','Từ tiếng Nhật',w.kanji,{required:true,max:200})}${inputField('kana','Cách đọc (かな)',w.kana,{max:200})}</div><div class="row-fields">${inputField('romaji','Romaji',w.romaji,{max:250})}${inputField('type','Loại từ / kính ngữ',w.type,{max:100})}</div>${inputField('vi','Nghĩa tiếng Việt',w.vi,{required:true})}${inputField('category','Chủ đề',w.category,{max:100})}${inputField('exampleJP','Ví dụ tiếng Nhật',w.exampleJP,{textarea:true,rows:2})}${inputField('exampleVI','Dịch câu ví dụ',w.exampleVI,{textarea:true,rows:2})}${inputField('notes','Lưu ý cách dùng',w.notes,{textarea:true,rows:2})}</form>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button>${item?`<button class="btn btn-danger" data-action="delete-word" data-id="${esc(item.id)}">${ico('trash')} Xóa</button>`:''}<button class="btn" type="submit" form="edit-form">${ico('save')} Lưu từ</button>`)}
function tDetail(t){modal(t.title,`<div class="tagrow"><span class="tag accent">${esc(catName(t.category))}</span><span class="tag">${esc(CHANNELS[t.channel])}</span><span class="tag">${esc(TONES[t.tone])}</span></div><div class="detail-jp jp-text">${esc(t.jp)}</div><div class="detail-vi">${esc(t.vi)}</div>${t.notes?`<div class="notice" style="margin-top:15px"><strong>Ghi chú:</strong> ${esc(t.notes)}</div>`:''}<div class="tagrow">${t.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>`,`<button class="btn btn-ghost" data-action="edit-template" data-id="${esc(t.id)}">${ico('edit')} Chỉnh sửa</button><button class="btn" data-action="copy-template" data-id="${esc(t.id)}">${ico('copy')} Sao chép JP</button>`)}
function wDetail(w){modal(w.kanji,`<div class="jp-text" style="font-size:23px">${esc(w.kanji)}</div><div class="kana">${esc(w.kana)} · ${esc(w.romaji)}</div><div class="tagrow"><span class="tag">${esc(w.type)}</span><span class="tag">${esc(w.category)}</span></div><h3 style="margin:18px 0">${esc(w.vi)}</h3><div class="detail-jp jp-text">${esc(w.exampleJP)}</div><div class="detail-vi">${esc(w.exampleVI)}</div>${w.notes?`<div class="notice" style="margin-top:18px">${esc(w.notes)}</div>`:''}`,`<button class="btn btn-ghost" data-action="edit-word" data-id="${esc(w.id)}">${ico('edit')} Chỉnh sửa</button><button class="btn" data-action="copy-word" data-id="${esc(w.id)}">${ico('copy')} Copy ví dụ</button>`)}
function varsOf(jp){return[...new Set(Array.from(jp.matchAll(/\{([a-zA-Z][a-zA-Z0-9_]{0,50})\}/g),m=>m[1]))]}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{let x=document.createElement('textarea');x.value=text;x.style.position='fixed';x.style.opacity='0';document.body.append(x);x.focus();x.select();if(!document.execCommand('copy'))throw new Error('copy failed');x.remove()}return true}catch(e){modal('Sao chép thủ công',`<p class="subline" style="margin-bottom:10px">Trình duyệt không cho phép sao chép tự động. Chọn và sao chép nội dung dưới đây:</p><div class="field"><textarea autofocus readonly rows="7">${esc(text)}</textarea></div>`);return false}}
async function copyTemplate(t){let vars=varsOf(t.jp);if(vars.length){modal('Điền thông tin trước khi copy',`<form id="var-form" data-form="variables" data-id="${esc(t.id)}"><p class="subline" style="margin-bottom:17px">Nhập thông tin cho các biến có trong mẫu câu.</p>${vars.map(v=>inputField('var_'+v,v.replaceAll('_',' ').toUpperCase(),'',{required:true})).join('')}</form>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button><button class="btn" form="var-form" type="submit">${ico('copy')} Copy hoàn chỉnh</button>`);return}if(await copyText(t.jp)){t.usageCount++;change();closeModal();render();toast('Đã sao chép câu tiếng Nhật')}}
function setEditor(p){modal(p?'Sửa bộ luyện':'Tạo bộ luyện',`<form id="edit-form" data-form="set" data-id="${esc(p?.id||'')}">${inputField('title','Tên bộ luyện',p?.title||'',{required:true})}${inputField('description','Mô tả / chủ đề',p?.description||'',{textarea:true,rows:2})}</form>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button><button class="btn" type="submit" form="edit-form">${ico('save')} Lưu bộ luyện</button>`)}
function sentenceEditor(setId,s){modal(s?'Chỉnh sửa câu':'Thêm câu luyện gõ',`<form id="edit-form" data-form="sentence" data-set="${esc(setId)}" data-id="${esc(s?.id||'')}">${inputField('jp','Câu tiếng Nhật',s?.jp||'',{textarea:true,rows:3,required:true})}${inputField('romaji','Romaji tham khảo (tùy chọn)',s?.romaji||'',{textarea:true,rows:2})}${inputField('vi','Dịch nghĩa / ghi chú',s?.vi||'',{textarea:true,rows:2})}</form>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button><button class="btn" type="submit" form="edit-form">${ico('save')} Lưu câu</button>`)}
function confirmDelete(text,fn){if(window.confirm(text)){fn();change();render();closeModal();toast('Đã xóa mục đã chọn')}}
function searchOpen(q=''){searchQuery=q;modal('Tìm kiếm trong Workspace',`<div style="display:flex;align-items:center;gap:10px">${ico('search')}<input class="command-input" id="global-query" autofocus placeholder="Nhập từ khóa Nhật hoặc Việt..." value="${esc(searchQuery)}" autocomplete="off"></div><div id="global-results" style="margin-top:10px;max-height:52vh;overflow:auto"></div>`,'',{search:true});searchUpdate()}
function searchUpdate(){let q=searchQuery;const ts=state.templates.filter(t=>match(q,[t.title,t.jp,t.vi,catName(t.category),...t.tags])).slice(0,8),ws=state.vocabulary.filter(w=>match(q,[w.kanji,w.kana,w.romaji,w.vi,w.exampleJP])).slice(0,7);const root=$('#global-results');if(!root)return;root.innerHTML=!q.trim()?`<div class="notice">Gõ tên tình huống, kanji, romaji hoặc nghĩa tiếng Việt để tìm nhanh.</div>`:(ts.length||ws.length)?`<div class="eyebrow" style="margin:10px">TEMPLATES · ${ts.length}</div>${ts.map(t=>`<button class="search-entry" data-action="detail-template" data-id="${esc(t.id)}"><span class="search-icon">${ico('templates')}</span><span style="min-width:0"><strong>${esc(t.title)}</strong><small>${esc(t.jp.replace(/\n/g,' '))}</small></span></button>`).join('')}<div class="eyebrow" style="margin:17px 10px 8px">DICTIONARY · ${ws.length}</div>${ws.map(w=>`<button class="search-entry" data-action="detail-word" data-id="${esc(w.id)}"><span class="search-icon">${ico('dictionary')}</span><span><strong>${esc(w.kanji)} · ${esc(w.kana)}</strong><small>${esc(w.vi)}</small></span></button>`).join('')}`:empty('Không có kết quả','Thử tìm kiếm từ khóa khác.');}
function payload(){return JSON.stringify(state).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
function download(content,name,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}
function exportHTML(){state.meta.updatedAt=now();state.meta.exportedAt=state.meta.updatedAt;const cloned=document.documentElement.cloneNode(true);const boot=cloned.querySelector('#embedded-data');boot.textContent=payload();cloned.querySelector('#import-file')?.remove();cloned.querySelector('#avatar-file')?.remove();cloned.querySelector('body')?.classList.remove('sidebar-open');cloned.querySelector('#app').innerHTML='';cloned.querySelector('#modal-root').innerHTML='';cloned.querySelector('#toast-root').innerHTML='';cloned.removeAttribute('data-theme');cloned.removeAttribute('style');const html='<!DOCTYPE html>\n'+cloned.outerHTML;const date=new Date().toISOString().slice(0,10);download(html,`Japanese-CS-Workspace-v${VERSION}-${date}.html`,'text/html;charset=utf-8');change();toast('Đã tạo file HTML có dữ liệu cá nhân')}
function exportJSON(){download(JSON.stringify({format:'JapaneseCSWorkspace',schema:SCHEMA,exportedAt:new Date().toISOString(),state},null,2),`Japanese-CS-Backup-${new Date().toISOString().slice(0,10)}.json`,'application/json');toast('Đã tạo bản sao lưu JSON')}
async function importJSON(file){if(!file)return;try{if(file.size>10000000)throw new Error('File JSON quá lớn (tối đa 10 MB).');const parsed=JSON.parse(await file.text()),incoming=sanitize(parsed.state||parsed);modal('Nhập bản sao lưu',`<p class="subline">Đã đọc: <strong>${incoming.templates.length} templates</strong>, <strong>${incoming.vocabulary.length} từ</strong>, <strong>${incoming.practiceSets.length} bộ luyện</strong>.</p><div class="notice" style="margin-top:15px"><strong>Gộp dữ liệu:</strong> giữ nội dung hiện có, bổ sung mục chưa trùng, cập nhật mục trùng ID khi bản nhập mới hơn.<br><strong>Thay thế:</strong> thay toàn bộ thư viện và cài đặt cá nhân bằng bản nhập.</div>`,`<button class="btn btn-ghost" data-action="modal-close">Hủy</button><button class="btn btn-secondary" data-action="do-merge">Gộp dữ liệu</button><button class="btn" data-action="do-replace">Thay thế</button>`);window.__jcswPendingImport=incoming}catch(e){toast('Không nhập được JSON: '+e.message,'error')}}
function mergeCollections(a,b,keyFn){const byId=new Map(a.map(x=>[x.id,x]));const fingerprints=new Set(a.map(keyFn));for(const x of b){let previous=byId.get(x.id);if(previous){if((x.updatedAt||0)>(previous.updatedAt||0)){Object.assign(previous,x)}}else if(!fingerprints.has(keyFn(x))){a.push(x);byId.set(x.id,x);fingerprints.add(keyFn(x))}}}
function handleImport(kind){const inc=window.__jcswPendingImport;if(!inc)return;if(kind==='replace'){const oldKey=state.meta.workspaceId;state=inc;if(oldKey!==state.meta.workspaceId){/* key of this open file must remain stable to preserve autosave on refresh */state.meta.workspaceId=oldKey}selectedSet=null}else{mergeCollections(state.templates,inc.templates,x=>norm(x.title+'|'+x.jp));mergeCollections(state.vocabulary,inc.vocabulary,x=>norm(x.kanji+'|'+x.kana));mergeCollections(state.practiceSets,inc.practiceSets,x=>norm(x.title));}delete window.__jcswPendingImport;change();applySettings();render();closeModal();toast(kind==='replace'?'Đã thay thế dữ liệu':'Đã gộp bản sao lưu')}
function updateInputWithFocus(fn){const inp=document.activeElement,name=inp?.dataset?.input,start=inp?.selectionStart,end=inp?.selectionEnd;fn();render();if(name){const el=$(`[data-input="${name}"]`);if(el){el.focus();if(typeof start==='number'&&el.type!=='range')try{el.setSelectionRange(start,end)}catch(e){}}}}
// Event delegation: dynamically generated pages and dialogs use a single event hub.
document.addEventListener('click',async e=>{if(e.target.classList.contains('overlay')&&e.target.dataset.dismiss){closeModal();return}const el=e.target.closest('[data-action],[data-nav],[data-cat],[data-filter-cat],[data-filter-channel],[data-filter-mastery],[data-theme],[data-accent]');if(!el||el===document.documentElement)return;if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.cat){tplFilter.cat=el.dataset.cat;go('templates');return}if(el.dataset.filterCat){tplFilter.cat=el.dataset.filterCat;render();return}if(el.dataset.filterChannel){tplFilter.channel=el.dataset.filterChannel;render();return}if(el.dataset.filterMastery){wordFilter.mastery=el.dataset.filterMastery;render();return}if(el.dataset.theme){state.settings.theme=el.dataset.theme;change();applySettings();render();return}if(el.dataset.accent){state.settings.accent=el.dataset.accent;change();applySettings();render();return}const a=el.dataset.action,k=el.dataset.id;const t=state.templates.find(x=>x.id===k),w=state.vocabulary.find(x=>x.id===k),s=state.practiceSets.find(x=>x.id===k);switch(a){case'toggle-nav':navOpen=!navOpen;document.body.classList.toggle('sidebar-open',navOpen);break;case'close-nav':navOpen=false;document.body.classList.remove('sidebar-open');break;case'search':searchOpen();break;case'modal-close':closeModal();break;case'new-template':tplEditor();break;case'edit-template':if(t)tplEditor(t);break;case'detail-template':if(t)tDetail(t);break;case'copy-template':if(t)await copyTemplate(t);break;case'fav-template':if(t){t.favorite=!t.favorite;t.updatedAt=now();change();render()}break;case'delete-template':if(t)confirmDelete('Xóa template này? Thao tác không thể hoàn tác.',()=>state.templates=state.templates.filter(x=>x.id!==k));break;case'new-word':wordEditor();break;case'edit-word':if(w)wordEditor(w);break;case'detail-word':if(w)wDetail(w);break;case'copy-word':if(w){if(await copyText(w.exampleJP||w.kanji))toast('Đã sao chép từ/câu ví dụ')}break;case'fav-word':if(w){w.favorite=!w.favorite;w.updatedAt=now();change();render()}break;case'delete-word':if(w)confirmDelete('Xóa từ vựng này?',()=>state.vocabulary=state.vocabulary.filter(x=>x.id!==k));break;case'export-html':exportHTML();break;case'export-json':exportJSON();break;case'import-json':$('#import-file').click();break;case'do-merge':handleImport('merge');break;case'do-replace':if(confirm('Thay thế toàn bộ dữ liệu hiện tại? Nên xuất backup trước.'))handleImport('replace');break;case'avatar-pick':$('#avatar-file').click();break;case'avatar-remove':state.settings.avatar='';change();render();break;case'new-set':setEditor();break;case'edit-set':if(s)setEditor(s);break;case'delete-set':if(s)confirmDelete('Xóa bộ luyện và toàn bộ câu trong bộ?',()=>{state.practiceSets=state.practiceSets.filter(x=>x.id!==k);if(selectedSet===k)selectedSet=null});break;case'open-set':selectedSet=k;render();break;case'set-back':selectedSet=null;render();break;case'new-sentence':sentenceEditor(k||selectedSet);break;case'edit-sentence':{let set=state.practiceSets.find(x=>x.id===el.dataset.set),sent=set?.sentences.find(x=>x.id===k);if(sent)sentenceEditor(set.id,sent)}break;case'delete-sentence':{let set=state.practiceSets.find(x=>x.id===el.dataset.set);if(set)confirmDelete('Xóa câu này khỏi bộ luyện?',()=>{set.sentences=set.sentences.filter(x=>x.id!==k);set.updatedAt=now()})}break;default:break}});
document.addEventListener('submit',async e=>{let form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const data=Object.fromEntries(new FormData(form).entries()),which=form.dataset.form,k=form.dataset.id;const val=(n,max=10000)=>String(data[n]||'').trim().slice(0,max);if(which==='template'){let category=val('category',100)==='__custom'?val('customCategory',100):val('category',100);if(!category){toast('Hãy nhập danh mục mới.','error');return}let old=state.templates.find(x=>x.id===k),newVal={title:val('title',300),category,channel:val('channel'),tone:val('tone'),jp:val('jp'),vi:val('vi'),tags:val('tags',1000).split(',').map(x=>x.trim()).filter(Boolean).slice(0,30),notes:val('notes',4000),updatedAt:now()};if(old)Object.assign(old,newVal);else state.templates.unshift({id:id(),favorite:false,usageCount:0,...newVal});change();closeModal();render();toast('Đã lưu template')}else if(which==='word'){let old=state.vocabulary.find(x=>x.id===k),fields=['kanji','kana','romaji','vi','type','category','exampleJP','exampleVI','notes'];let v=Object.fromEntries(fields.map(x=>[x,val(x)]));v.updatedAt=now();if(old)Object.assign(old,v);else state.vocabulary.unshift({id:id(),favorite:false,mastery:'new',...v});change();closeModal();render();toast('Đã lưu từ vựng')}else if(which==='settings'){state.meta.name=val('name',100);state.meta.workspaceName=val('workspaceName',100);change();render();toast('Đã lưu cài đặt')}else if(which==='set'){let old=state.practiceSets.find(x=>x.id===k);if(old){old.title=val('title',250);old.description=val('description',2000);old.updatedAt=now()}else{state.practiceSets.unshift({id:id(),title:val('title',250),description:val('description',2000),sentences:[],updatedAt:now()})}change();closeModal();render();toast('Đã lưu bộ luyện')}else if(which==='sentence'){let set=state.practiceSets.find(x=>x.id===form.dataset.set);if(!set)return;let old=set.sentences.find(x=>x.id===k);let v={jp:val('jp',4000),romaji:val('romaji',4000),vi:val('vi',4000),updatedAt:now()};if(old)Object.assign(old,v);else set.sentences.push({id:id(),...v});set.updatedAt=now();change();closeModal();render();toast('Đã lưu câu luyện gõ')}else if(which==='variables'){const t=state.templates.find(x=>x.id===k);if(!t)return;let content=t.jp.replace(/\{([a-zA-Z][a-zA-Z0-9_]{0,50})\}/g,(m,key)=>data['var_'+key]??m);if(await copyText(content)){t.usageCount++;change();closeModal();render();toast('Đã copy template hoàn chỉnh')}}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='global-query'){searchQuery=el.value;searchUpdate();return}if(el.dataset.input==='tpl-query'){updateInputWithFocus(()=>{tplFilter.q=el.value});return}if(el.dataset.input==='word-query'){updateInputWithFocus(()=>{wordFilter.q=el.value});return}if(el.dataset.input==='font-scale'){state.settings.fontScale=Number(el.value);change();applySettings();const label=$('label[for="font-scale"]');if(label)label.textContent=`Cỡ chữ · ${Math.round(state.settings.fontScale*100)}%`;return}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.sort==='template'){tplFilter.sort=el.value;render()}if(el.dataset.mastery){const w=state.vocabulary.find(x=>x.id===el.dataset.mastery);if(w){w.mastery=el.value;w.updatedAt=now();change();toast('Đã cập nhật tiến độ')}}if(el.name==='category'&&el.closest('[data-form="template"]')){const holder=$('#custom-cat-holder');if(holder)holder.classList.toggle('hidden',el.value!=='__custom')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveTimer);persist()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&!$('#modal-root .overlay')){e.preventDefault();tplEditor()}if(e.key==='Escape'){if($('#modal-root .overlay'))closeModal();else if(navOpen){navOpen=false;document.body.classList.remove('sidebar-open')}}});
const importInput=document.createElement('input');importInput.type='file';importInput.accept='.json,application/json';importInput.className='file-input';importInput.id='import-file';importInput.addEventListener('change',e=>{importJSON(e.target.files?.[0]);e.target.value=''});document.body.append(importInput);
const avatarInput=document.createElement('input');avatarInput.type='file';avatarInput.accept='image/png,image/jpeg,image/webp';avatarInput.className='file-input';avatarInput.id='avatar-file';avatarInput.addEventListener('change',e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Chỉ nhận PNG, JPG, WebP','error');return}if(file.size>5e6){toast('Ảnh vượt quá 5 MB','error');return}const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d');const side=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);state.settings.avatar=canvas.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);change();render();toast('Đã cập nhật avatar')};image.onerror=()=>{URL.revokeObjectURL(url);toast('Không đọc được ảnh','error')};image.src=url});document.body.append(avatarInput);
init().catch(e=>{console.error(e);render();toast('Không thể tải tự lưu; hãy xuất file để sao lưu.','error')});
})();
